version: 2
updates:
  # npm dependencies — grouped minor/patch to reduce PR noise; majors separate.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    # Wait 7 days before proposing a newly published version — a freshly published
    # package can be malicious or unstable (supply-chain hardening).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch

  # GitHub Actions used by the workflows above — grouped minor/patch.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    # Wait 7 days before proposing a newly published version — a freshly published
    # action can be malicious or unstable (supply-chain hardening).
    cooldown:
      default-days: 7
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
