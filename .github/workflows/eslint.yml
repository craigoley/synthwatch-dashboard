name: ESLint

on:
  push:
    branches: [main]
  # ★ NO `branches:` FILTER ON pull_request — DELIBERATE, DO NOT ADD ONE BACK. With `branches: [main]`
  #   this gate did not run at all on a PR targeting a non-main base, so a STACKED PR displayed no gate
  #   run and read to a reviewer as gated while asserting nothing. See scripts/check-pr-trigger-coverage.sh.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eslint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22

      # Use the repo-pinned pnpm (packageManager: pnpm@10.x) via corepack so the
      # security workflows never drift from the version Vercel uses.
      - name: Enable corepack (pinned pnpm)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint (zero warnings)
        run: pnpm lint
