name: OSV-Scanner (PR)

# Diff scan on PRs: reports vulnerabilities introduced by the PR only, and does
# NOT fail on pre-existing/transitive vulns (e.g. ones already tracked by an
# open Dependabot PR). Uses Google's official reusable diff workflow.
on:
  # ★ NO `branches:` FILTER ON pull_request — DELIBERATE, DO NOT ADD ONE BACK. With `branches: [main]`
  #   this gate did not run at all on a PR targeting a non-main base, so a STACKED PR displayed no gate
  #   run and read to a reviewer as gated while asserting nothing. See scripts/check-pr-trigger-coverage.sh.
  pull_request:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  scan-pr:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@v2.3.8
    with:
      # Non-blocking on PRs — surface findings without failing the check.
      fail-on-vuln: false
