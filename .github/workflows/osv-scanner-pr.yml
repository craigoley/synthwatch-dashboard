name: OSV-Scanner (PR)

# Diff scan on PRs: reports vulnerabilities introduced by the PR only, and does
# NOT fail on pre-existing/transitive vulns (e.g. ones already tracked by an
# open Dependabot PR). Uses Google's official reusable diff workflow.
on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  scan-pr:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@v2.3.8
    with:
      # Non-blocking on PRs — surface findings without failing the check.
      fail-on-vuln: false
