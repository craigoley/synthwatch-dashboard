name: Claude Review

# Fleet auto-pipeline: review the PR diff -> post inline + summary comments ->
# optionally commit safe fixes to the branch. Merging is NOT done here — it is
# handled by auto-merge.yml (trusted authors only, gated on the required checks),
# so a prompt-injected untrusted diff has no path to a merge. Runs on the Max
# subscription OAuth token (no per-use API cost).
#
# LAYER 2 (findings gate): the review ends with a single `REVIEW_VERDICT: BLOCK|PASS`
# line; the "Enforce review verdict" step parses the LAST one and FAILS the job on
# BLOCK. Because "Claude review" (this job's name) is a REQUIRED status check,
# native auto-merge then HOLDS the merge on BLOCK and proceeds on PASS. FAIL-OPEN:
# a missing/malformed/errored review never blocks (the gate exits 0 with a warning).
# Layer 1 (the merge waits for this check to COMPLETE) is the required-context setup.
#
# IMPORTANT (root cause of the earlier no-op): supplying `prompt` on a
# pull_request event runs the action in AUTOMATION mode, which by design does
# NOT create a tracking comment and does NOT wire up the GitHub comment /
# inline-comment MCP tools. Claude then reviews "in its head" and posts nothing
# (33 turns, is_error:false, zero comments). `track_progress: true` forces TAG
# mode for these PR events, which restores the tracking comment AND the
# mcp__github_inline_comment__create_inline_comment tool so the review actually
# gets posted. (Supported events: opened, synchronize, ready_for_review, reopened.)
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write # commit safe fixes to the PR branch (NOT merge — see auto-merge.yml)
  pull-requests: write # post review comments
  id-token: write # OIDC for the action

jobs:
  claude-review:
    name: Claude review
    runs-on: ubuntu-latest
    # claude-code-action rejects non-human actors and errors on them — skip bots.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      - name: Claude review
        id: review
        # FAIL-OPEN: if the action itself errors (token, network, timeout), the step
        # fails but does NOT fail the job — the enforce step (if: always()) then finds
        # no verdict and exits 0. A review error must never block a merge.
        continue-on-error: true
        uses: anthropics/claude-code-action@2fee15510437d71399d9139ed60433470484a8fb # v1
        env:
          # Authenticate the `gh` CLI used by the Bash tool (gh pr comment/diff/view).
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The action blocks ALL bot actors by default (checkHumanActor). Allow ONLY
          # github-actions[bot] so legitimate re-triggers (a close+reopen, or any
          # github-actions-initiated run) pass the guard. NOT '*': every other bot —
          # including dependabot[bot], also excluded at the job `if:` above — stays
          # blocked. (Matching is case-insensitive and strips the [bot] suffix.)
          allowed_bots: "github-actions[bot]"
          # Force tag mode so the action creates a tracking comment AND enables the
          # GitHub comment + inline-comment MCP tools (see header note). Without
          # this, automation mode gives Claude no way to post its review.
          track_progress: true
          prompt: |
            You are the automated reviewer for this PR (SynthWatch dashboard:
            Next.js App Router + TypeScript + Tailwind on Vercel).

            Review the PR diff for correctness, security, and bugs. Pay particular
            attention to this repo's hard invariants — flag any change that breaks them:
              1. API-layer boundary: ONLY route handlers under src/app/api/** may
                 import @/lib/db; NO React component or page may import `pg` or the db
                 client. The db client is server-only.
              2. No-build-time-DB: `pnpm build` MUST succeed with DATABASE_URL unset.
                 Route handlers stay dynamic; nothing may require a DB connection at
                 build time.
              3. Schema types are commit-time only: src/db-types.ts is generated by
                 pg-to-ts and committed; it is NEVER generated during the build.
              4. The packageManager pnpm@10.x pin must stay intact; install steps use
                 --frozen-lockfile.

            You MUST post your review to GitHub using the tools — do not just think it
            through and stop:
              - Post each specific, actionable finding as an inline comment on the
                exact file/line using
                mcp__github_inline_comment__create_inline_comment.
              - Provide your overall summary as your final message; it is posted as
                the PR (tracking) comment automatically. If you have no actionable
                findings, say so explicitly in that summary.

            You do NOT merge — merging is handled separately by the auto-merge
            workflow (trusted authors only, gated on the required checks). If you
            find actionable issues you can fix safely, commit the fix to the PR
            branch (verify with `pnpm typecheck` / `pnpm build` where relevant);
            otherwise leave the comments for the author. Never run `gh pr merge`.

            ★ VERDICT (REQUIRED): after posting your review, the FINAL line of your
            response must be your verdict, in EXACTLY this format and with nothing
            after it:
              REVIEW_VERDICT: <BLOCK or PASS>
            Replace <BLOCK or PASS> with one word. Use BLOCK ONLY for issues that must
            not merge: correctness bugs, security vulnerabilities, data loss, or
            breaking changes / broken invariants (including the hard invariants above).
            For everything else — style, nits, suggestions, minor improvements — use
            PASS and leave them as comments (do not block). If you are unsure, use PASS.
            An honest PASS with nits beats a wrong BLOCK. The gate reads the LAST
            REVIEW_VERDICT line.
          # --allowedTools MUST be a single QUOTED value. claude_args is parsed with
          # shell-quote, which splits on UNQUOTED whitespace (it escapes () but not
          # spaces). So any tool pattern containing a space — Bash(gh pr comment:*),
          # Bash(npx tsc:*) — would get shredded into invalid fragments ("Bash(gh",
          # "pr:*)", ...) and silently dropped (the earlier no-op: 17 permission
          # denials, nothing posted). Wrapping the whole comma-list in double quotes
          # keeps it one token; the action comma-splits it so each pattern survives.
          #
          # ★ NO MERGE CAPABILITY: review is advisory — merging is auto-merge.yml's
          # job (trusted-gated). The broad Bash(gh pr:*) wildcard is deliberately
          # NOT granted (it would include `gh pr merge`); only the specific non-merge
          # subcommands are. Bash(gh api:*) is likewise withheld (it is an API merge
          # path). So even a prompt-injected diff cannot make the reviewer merge.
          # --model belongs in claude_args (there is no valid top-level --model input).
          claude_args: |
            --model claude-opus-4-8
            --max-turns 50
            --allowedTools "Edit,Write,Read,Bash(git:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(pnpm:*),Bash(npx tsc:*),mcp__github_inline_comment__create_inline_comment"

      # Layer 2 — findings gate. The review's final message ends with
      # `REVIEW_VERDICT: BLOCK|PASS`. The verdict is read from the action's
      # execution_file (the authoritative Claude Code execution log) — specifically
      # the model's RESULT/assistant text, NOT the raw prompt (which lists both
      # example verdict lines and would otherwise contaminate the parse). This step
      # is the SOLE arbiter of the "Claude review" check-run conclusion:
      #   BLOCK -> exit 1 -> check FAILS -> branch protection holds merge.
      #   PASS  -> exit 0 -> check passes.
      #   missing / garbled / review errored (no execution_file) -> FAIL-OPEN -> exit 0
      #     (a transient LLM hiccup must never deadlock merge; Layer 1 already
      #     guaranteed the review RAN as a required check).
      # if: always() so it decides even when the review step (continue-on-error) failed.
      # NOTE: parse logic is IDENTICAL to the runner's (craigoley/synthwatch) gate.
      - name: Verdict gate
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
        run: |
          set -uo pipefail
          verdict='<none>'
          if [ -n "${EXECUTION_FILE:-}" ] && [ -f "$EXECUTION_FILE" ]; then
            # Extract the model's FINAL text only (result entries, else the last
            # assistant text block) — recursive so it works whether the log is a JSON
            # array or NDJSON-slurped. Excludes the user/prompt message.
            text=$(jq -rs '[.. | objects | select(.type=="result") | .result? | strings] | last // ""' "$EXECUTION_FILE" 2>/dev/null || echo "")
            if [ -z "$text" ]; then
              text=$(jq -rs '[.. | objects | select(.type=="assistant") | (.message?.content? // [])[]? | select(.type=="text") | .text] | last // ""' "$EXECUTION_FILE" 2>/dev/null || echo "")
            fi
            parsed=$(printf '%s' "$text" | grep -oiE 'REVIEW_VERDICT:[[:space:]]*(BLOCK|PASS)' | tail -1 | grep -oiE '(BLOCK|PASS)' | tr '[:lower:]' '[:upper:]' || true)
            [ -n "$parsed" ] && verdict="$parsed"
            echo "[review] execution_file=$EXECUTION_FILE  final_text_len=${#text}  parsed_verdict='$verdict'"
          else
            echo "[review] no execution_file (review errored/skipped) — parsed_verdict='<none>'"
          fi
          if [ "$verdict" = "BLOCK" ]; then
            echo "::error::Claude review verdict: BLOCK — a blocking finding holds this merge until resolved."
            exit 1
          fi
          if [ "$verdict" = "PASS" ]; then
            echo "[review] verdict PASS — merge may proceed."
            exit 0
          fi
          echo "::warning::[review] no verdict parsed — failing open to PASS (an LLM hiccup must not deadlock merge)."
          exit 0
