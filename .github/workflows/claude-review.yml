name: Claude Review

# Fleet auto-pipeline: review the PR diff -> post inline + summary comments ->
# if asked to merge (or the review is clean) address findings on the branch and
# squash-merge. Runs on the Max subscription OAuth token (no per-use API cost).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write # commit fixes to the PR branch + merge
  pull-requests: write # post comments, merge the PR
  id-token: write # OIDC for the action

jobs:
  claude-review:
    name: Claude review
    runs-on: ubuntu-latest
    # claude-code-action rejects non-human actors and errors on them — skip bots.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1

      - name: Claude review
        uses: anthropics/claude-code-action@2fee15510437d71399d9139ed60433470484a8fb # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are the automated reviewer for this PR (SynthWatch dashboard:
            Next.js App Router + TypeScript + Tailwind on Vercel).

            Review the PR diff for correctness, security, and bugs. Pay particular
            attention to this repo's hard invariants — flag any change that breaks them:
              1. API-layer boundary: ONLY route handlers under src/app/api/** may
                 import @/lib/db; NO React component or page may import `pg` or the db
                 client. The db client is server-only.
              2. No-build-time-DB: `pnpm build` MUST succeed with DATABASE_URL unset.
                 Route handlers stay dynamic; nothing may require a DB connection at
                 build time.
              3. Schema types are commit-time only: src/db-types.ts is generated by
                 pg-to-ts and committed; it is NEVER generated during the build.
              4. The packageManager pnpm@10.x pin must stay intact; install steps use
                 --frozen-lockfile.

            How to report (post to GitHub only — do NOT print the review as chat text):
              - Post specific, actionable findings as inline comments using
                mcp__github_inline_comment__create_inline_comment.
              - Post one concise top-level summary with `gh pr comment`.

            Then resolve the PR:
              - If the PR author asks to merge, OR the review finds nothing actionable,
                fix any actionable findings by committing to the PR branch (verify with
                `pnpm typecheck` / `pnpm build` where relevant), then squash-merge:
                `gh pr merge --squash --delete-branch`.
              - Otherwise leave the comments for the author and do not merge.
          # --allowedTools value is intentionally UNQUOTED: quotes inside a block
          # scalar become part of the argument and Claude would match no tools.
          # --model belongs in claude_args (there is no valid top-level --model input).
          claude_args: |
            --model claude-opus-4-8
            --max-turns 50
            --allowedTools Edit,Write,Read,Bash(git:*),Bash(gh pr:*),Bash(gh api:*),Bash(pnpm:*),Bash(npx tsc:*),mcp__github_inline_comment__create_inline_comment
