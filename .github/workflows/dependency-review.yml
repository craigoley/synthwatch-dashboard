name: Dependency review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Review dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # post the summary comment
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency review
        # Pinned to the v4 line (no moving `v4` tag is published for this action).
        uses: actions/dependency-review-action@v5.0.0
        with:
          # Warn-only: never block the PR; surface a summary comment instead.
          warn-only: true
          comment-summary-in-pr: always
