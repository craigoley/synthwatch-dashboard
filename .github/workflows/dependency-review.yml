name: Dependency review

on:
  # ★ NO `branches:` FILTER ON pull_request — DELIBERATE, DO NOT ADD ONE BACK. With `branches: [main]`
  #   this gate did not run at all on a PR targeting a non-main base, so a STACKED PR displayed no gate
  #   run and read to a reviewer as gated while asserting nothing. See scripts/check-pr-trigger-coverage.sh.
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Review dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # post the summary comment
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Warn-only: never block the PR; surface a summary comment instead.
          warn-only: true
          comment-summary-in-pr: always
