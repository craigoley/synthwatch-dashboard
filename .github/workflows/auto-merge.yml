name: Auto-merge

# Hands-free merge for TRUSTED authors. This workflow only ENABLES GitHub's
# native auto-merge (allow_auto_merge=true on the repo); GitHub then holds the PR
# and squash-merges it the moment every REQUIRED status check is green
# (currently "E2E / Playwright (hermetic)"). It never bypasses a check.
#
# ★ SECURITY (public repo): auto-merge fires ONLY for the explicit trusted-author
# allowlist below AND only for PRs whose BASE is main. Both conditions are the
# single security boundary: the allowlist decides WHO, the base condition decides
# WHERE. A stacked PR (base = another feature branch) is skipped entirely — feature
# branches carry no protection/required checks, so a merge into one would be instant
# and unreviewed (the July-4 runner #192 incident class). ANY other author's PR is
# likewise skipped, so it can NEVER auto-merge even with all checks green.
# "Checks passing" is NOT authorization to merge; the allowlist is. The trust gate
# is a job-level `if:` evaluated by GitHub BEFORE the job runs, so an untrusted
# author's (or non-main-base) job is skipped entirely — there is no merge step to reach.
#
# The merge is intentionally NOT performed by the Claude review action (which acts
# on PR-supplied content); a prompt-injected untrusted diff therefore has no path
# to a merge. Review (claude-review.yml) is advisory only.

on:
  pull_request:
    # ★ auto_merge_disabled added so a DROPPED auto-merge recovers: GitHub sometimes disables auto-merge
    # AFTER we enable it (a race when a required check resolves as "skipped" — what stranded PR #118:
    # auto_merge_enabled → auto_merge_disabled → orphaned CLEAN-but-unmerged, with no event to re-trigger).
    types: [opened, synchronize, reopened, ready_for_review, auto_merge_disabled]

permissions:
  contents: write # merge the PR
  pull-requests: write # enable auto-merge

jobs:
  auto-merge:
    name: Enable auto-merge (trusted authors only)
    runs-on: ubuntu-latest
    # ★ TRUST GATE — the single security boundary. Webhook user.login values:
    # operator craigoley / cao825, agent craigoleyagent, and dependabot[bot]
    # (the [bot] form is what pull_request webhooks send). Anyone else → skipped.
    # ★ base == main required (July-4 runner #192: stacked PR + trusted author + unprotected base branch
    # = instant unreviewed merge — here even WITHOUT auto-merge enablement, via the `|| gh pr merge`
    # direct-merge fallback below, which fires on the job's FIRST run for an already-green stacked PR).
    if: >-
      github.event.pull_request.base.ref == 'main' &&
      contains(fromJSON('["craigoley", "cao825", "craigoleyagent", "dependabot[bot]"]'),
      github.event.pull_request.user.login)
    steps:
      - name: Enable native auto-merge (or merge directly if already mergeable)
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        # Enable GitHub's native auto-merge — it waits for the required checks, then squash-merges. If it
        # CAN'T be enabled because the PR is ALREADY mergeable (all required checks green by the time this
        # runs — e.g. an auto_merge_disabled re-run on a now-CLEAN PR), fall back to a direct squash merge.
        # ★ Neither path uses --admin, so branch protection is NEVER bypassed: the direct merge only
        # succeeds when GitHub already considers the PR mergeable. The trust gate above is still the only
        # authorization. This recovers the #118 "enabled-then-dropped, left CLEAN-but-open" stall.
        run: >-
          gh pr merge "$PR" --auto --squash --delete-branch --repo "$REPO"
          || gh pr merge "$PR" --squash --delete-branch --repo "$REPO"
